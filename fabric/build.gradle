apply from: rootProject.file("gradle/node.gradle")
apply plugin: "com.gradleup.shadow"

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

dependencies {
    add(modImpl, "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}")
    add(modImpl, "net.fabricmc.fabric-api:fabric-api:${vd.fabricApi}")
    add(modImpl, "dev.architectury:architectury-fabric:${vd.arch}")

    common(project(path: ":common:${mcVer}", configuration: commonCfg)) { transitive false }
    shadowCommon(project(path: ":common:${mcVer}", configuration: "transformProductionFabric")) { transitive false }
}

processResources {
    def props = [version: project.version, minecraft: vd.mc, architectury: vd.arch]
    inputs.properties props
    filesMatching("fabric.mod.json") {
        expand props
    }
}

jar {
    archiveClassifier = "raw"
}

shadowJar {
    exclude "architectury.common.json"
    dependsOn jar
    mainSpec.sourcePaths.clear()
    from(zipTree(jar.archiveFile))
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = null
}

assemble.dependsOn shadowJar

loom {
    runs {
        client {
            // Fixed dev username: offline UUIDs come from the name, so a stable name keeps the same player data.
            programArgs "--username", "Player896"
        }
    }
}
