pluginManagement {
    repositories {
        maven { url "https://maven.kikugie.dev/releases" }
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://maven.neoforged.net/releases/" }
        gradlePluginPortal()
    }
}

plugins {
    id "dev.kikugie.stonecutter" version "0.9.8"
}

if (JavaVersion.current().ordinal() + 1 < 25) {
    throw new IllegalStateException("Please run gradle with Java 25+!")
}

// Every Minecraft version we build for. Per-version dependency versions live in gradle/versions.gradle.
stonecutter {
    shared {
        versions "1.21.1", "26.1.2", "26.2", "26.3"
        vcsVersion = "26.3"
    }
    // Each module becomes one node per version, e.g. :fabric:26.3
    create("common", "fabric", "neoforge")
}

rootProject.name = "gatebound"
