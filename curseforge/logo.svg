<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="75%">
      <stop offset="0" stop-color="#2a1b5e"/>
      <stop offset="0.55" stop-color="#110b2b"/>
      <stop offset="1" stop-color="#05030f"/>
    </radialGradient>
    <radialGradient id="portal" cx="50%" cy="60%" r="62%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.18" stop-color="#bff3ff"/>
      <stop offset="0.45" stop-color="#56a8ff"/>
      <stop offset="0.75" stop-color="#7a3df0"/>
      <stop offset="1" stop-color="#3a1280"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7fb8ff" stop-opacity="0.65"/>
      <stop offset="0.5" stop-color="#7a3df0" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#7a3df0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b3d52"/>
      <stop offset="0.5" stop-color="#6d7088"/>
      <stop offset="1" stop-color="#34364a"/>
    </linearGradient>
    <linearGradient id="stoneDark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1c1d2c"/>
      <stop offset="0.5" stop-color="#3a3c52"/>
      <stop offset="1" stop-color="#191a28"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="0.45" stop-color="#f5c451"/>
      <stop offset="1" stop-color="#b9762a"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#bff3ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#bff3ff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="arch">
      <path d="M312 700 V420 A200 200 0 0 1 712 420 V700 Z"/>
    </clipPath>
    <filter id="blur8"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="blur20"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- stars -->
  <g fill="#cfe3ff" opacity="0.8">
    <circle cx="96" cy="110" r="2"/><circle cx="180" cy="260" r="1.6"/><circle cx="70" cy="420" r="1.8"/>
    <circle cx="930" cy="140" r="2.2"/><circle cx="860" cy="300" r="1.6"/><circle cx="960" cy="470" r="1.8"/>
    <circle cx="250" cy="70" r="1.6"/><circle cx="760" cy="80" r="1.8"/><circle cx="420" cy="40" r="1.4"/>
    <circle cx="610" cy="60" r="1.6"/><circle cx="130" cy="600" r="1.6"/><circle cx="905" cy="610" r="1.8"/>
  </g>

  <!-- halo behind the gate -->
  <circle cx="512" cy="480" r="400" fill="url(#halo)"/>

  <!-- light rays -->
  <g opacity="0.35" filter="url(#blur8)">
    <path d="M512 540 L120 100 L220 70 Z" fill="#7fb8ff"/>
    <path d="M512 540 L904 100 L804 70 Z" fill="#7fb8ff"/>
    <path d="M512 540 L400 20 L470 10 Z" fill="#bff3ff"/>
    <path d="M512 540 L624 20 L554 10 Z" fill="#bff3ff"/>
  </g>

  <!-- outer stone frame (arch) -->
  <path d="M262 730 V420 A250 250 0 0 1 762 420 V730 Z" fill="url(#stone)"/>
  <path d="M262 730 V420 A250 250 0 0 1 762 420 V730 Z" fill="none" stroke="#14151f" stroke-width="6"/>
  <!-- keystone blocks -->
  <g stroke="#14151f" stroke-width="4" fill="url(#stoneDark)">
    <path d="M480 168 H544 L552 232 H472 Z"/>
    <path d="M380 205 L440 180 L452 240 L392 262 Z"/>
    <path d="M644 205 L584 180 L572 240 L632 262 Z"/>
    <path d="M300 280 L358 244 L378 296 L322 336 Z"/>
    <path d="M724 280 L666 244 L646 296 L702 336 Z"/>
  </g>
  <!-- rune on keystone -->
  <path d="M512 186 L528 212 L512 222 L496 212 Z" fill="#bff3ff" filter="url(#glow)"/>

  <!-- portal -->
  <path d="M312 700 V420 A200 200 0 0 1 712 420 V700 Z" fill="url(#portal)"/>
  <g clip-path="url(#arch)">
    <!-- swirl rings -->
    <g fill="none" stroke="#ffffff" stroke-linecap="round" filter="url(#glow)">
      <ellipse cx="512" cy="480" rx="170" ry="210" stroke-width="3" opacity="0.35"/>
      <ellipse cx="512" cy="490" rx="125" ry="165" stroke-width="3" opacity="0.5" transform="rotate(-12 512 490)"/>
      <ellipse cx="512" cy="500" rx="80" ry="115" stroke-width="3" opacity="0.65" transform="rotate(14 512 500)"/>
      <ellipse cx="512" cy="510" rx="38" ry="64" stroke-width="3" opacity="0.8"/>
    </g>

    <!-- beam and the Spire seen through the gate -->
    <rect x="496" y="150" width="32" height="400" fill="url(#beam)" opacity="0.8"/>
    <g fill="#1a1236">
      <path d="M512 262 L526 262 L534 330 L546 330 L552 470 L572 470 L580 640 L444 640 L452 470 L472 470 L478 330 L490 330 L498 262 Z"/>
      <path d="M498 262 L512 214 L526 262 Z"/>
    </g>
    <g fill="#ffe9a8" filter="url(#glow)">
      <rect x="506" y="290" width="12" height="18"/>
      <rect x="500" y="380" width="8" height="14"/><rect x="516" y="380" width="8" height="14"/>
      <rect x="488" y="500" width="10" height="16"/><rect x="514" y="500" width="10" height="20"/><rect x="540" y="500" width="10" height="16"/>
      <rect x="480" y="570" width="10" height="16"/><rect x="530" y="570" width="10" height="16"/>
    </g>
    <path d="M512 214 L512 196" stroke="#ffe9a8" stroke-width="4" filter="url(#glow)"/>

    <!-- ground mist -->
    <ellipse cx="512" cy="690" rx="230" ry="40" fill="#bff3ff" opacity="0.55" filter="url(#blur8)"/>
  </g>

  <!-- inner edge of the frame -->
  <path d="M312 700 V420 A200 200 0 0 1 712 420 V700" fill="none" stroke="#bff3ff" stroke-width="5" opacity="0.8" filter="url(#glow)"/>

  <!-- pillars base -->
  <rect x="236" y="700" width="96" height="60" fill="url(#stoneDark)" stroke="#14151f" stroke-width="4"/>
  <rect x="692" y="700" width="96" height="60" fill="url(#stoneDark)" stroke="#14151f" stroke-width="4"/>
  <rect x="210" y="750" width="604" height="34" fill="url(#stone)" stroke="#14151f" stroke-width="4"/>

  <!-- light spill on the steps -->
  <ellipse cx="512" cy="786" rx="260" ry="22" fill="#7fb8ff" opacity="0.5" filter="url(#blur8)"/>

  <!-- sparks -->
  <g fill="#ffffff" filter="url(#glow)">
    <circle cx="380" cy="640" r="4"/><circle cx="650" cy="600" r="3.5"/><circle cx="440" cy="560" r="3"/>
    <circle cx="596" cy="660" r="3"/><circle cx="360" cy="470" r="3"/><circle cx="672" cy="450" r="3.5"/>
    <circle cx="470" cy="340" r="2.5"/><circle cx="560" cy="360" r="2.5"/><circle cx="330" cy="560" r="2.5"/>
  </g>

  <!-- title -->
  <g text-anchor="middle" font-family="'Palatino Linotype','Book Antiqua',Georgia,serif" font-weight="700">
    <text x="512" y="896" font-size="112" letter-spacing="10" fill="#000" opacity="0.6" filter="url(#blur8)">GATEBOUND</text>
    <text x="512" y="896" font-size="112" letter-spacing="10" fill="url(#gold)" stroke="#5a3410" stroke-width="3" paint-order="stroke">GATEBOUND</text>
  </g>
  <line x1="300" y1="936" x2="724" y2="936" stroke="#f5c451" stroke-width="2" opacity="0.8"/>
</svg>
