apply from: rootProject.file("gradle/node.gradle")
apply plugin: "com.gradleup.shadow"

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

dependencies {
    neoForge "net.neoforged:neoforge:${vd.neoforge}"
    add(modImpl, "dev.architectury:architectury-neoforge:${vd.arch}")

    common(project(path: ":common:${mcVer}", configuration: commonCfg)) { transitive false }
    shadowCommon(project(path: ":common:${mcVer}", configuration: "transformProductionNeoForge")) { transitive false }
}

processResources {
    def props = [version: project.version, minecraft: vd.mc, neoforge: vd.neoforge, architectury: vd.arch]
    inputs.properties props
    filesMatching("META-INF/neoforge.mods.toml") {
        expand props
    }
}

jar {
    archiveClassifier = "raw"
}

shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"
    dependsOn jar
    mainSpec.sourcePaths.clear()
    from(zipTree(jar.archiveFile))
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = null
}

assemble.dependsOn shadowJar

loom {
    runs {
        client {
            // Fixed dev username: offline UUIDs come from the name, so a stable name keeps the same player data.
            programArgs "--username", "Player896"
        }
    }
}
